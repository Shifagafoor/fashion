<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Majestic</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        <p>Enter your registered email address.
        We'll send you a verification code.</p>
        <form>
            <label>E-mail Address</label>
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Sent OTP</button>
        </form>
        <div class="back">
            <a href="login.html">← Back  to login</a>
        </div>
    </div>
</body>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'poppins', sans-serif;
    }
    body{
        background:#f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .container{
        width: 420px;
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }
    h2{
        text-align: center;
        margin-bottom: 10px;
    }
    p{
        text-align: center;
        color: #666;
        margin-bottom: 25px;
        font-size: 15px;
    }
    label{
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
    }
    input{
        width: 100%;
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 20px;
        outline: none;
    }
    button{
        width: 100%;
        padding: 14px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }
    .back{
        margin-top: 20px;
        text-align: center;
    }
    .back a{
        color: #000;
        text-decoration: none;
        font-weight: 600;
    }

</style>
</html>
