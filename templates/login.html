<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Majestic</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="login-container">
        <div class="left">
            <h1>MAJESTIC</h1>
            <p>Welcome Back <br> Login to continue shopping with us.</p>
        </div>
        <div class="right">
            <h2>Login</h2>
            <form>
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" >
                </div>
                <div class="input-box">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" >
                </div>
                <div class="forget">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>
                <button class="btn">Login</button>
                <div class="signup">Don't have an account?
                    <a href="signup.html">Sign up</a>
                </div>
            </form>
        </div>
    </div>
</body>
<style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'poppins',sans-serif;
        }

        body{
            background:#f8f8f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            width:900px;
            background:#fff;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }
        .left{
            width: 50%;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
        
        }
        .left h1{
            font-size: 40px;
            margin-bottom: 15px;
        }

        .left p{
            text-align: center;
            line-height: 25px;
        }

        .right{
            width: 50%;
            padding: 50px;
        }

        .right h2{
            margin-bottom: 30px;
            color: #111;
        }

        .input-box{
            margin-bottom: 20px;
        }

        .input-box label{
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-box input{
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        
        .forget{
            text-align: right;
            margin-bottom:20px;
        }

        .forget a{
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .btn{
            width: 100%;
            padding: 14px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }

        .signup{
            margin-top: 20px;
            text-align: center;
        }

        .signup a{
            text-decoration: none;
            color: black;
            font-weight: 600;
        }

        @media (max-width : 768px) {
            .login-container{
                flex-direction: column;
                width: 90%;
            }

            .left, .right{
                width: 100%;
            }

            .left{
                padding: 30px;
            }
        }

    </style>
</html>
