{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="account-container">

    <div class="header">
        ACCOUNT
    </div>  


    <!-- PROFILE -->
    <a href="{% url 'profile' %}" class="profile-box">

        {% if user.profile_photo %}

            <img
                src="{{ user.profile_photo.url }}"
                class="profile-photo"
                alt="Profile Photo"
            >

        {% else %}

            <div class="profile-avatar">
                {{ user.first_name|first|upper }}
            </div>

        {% endif %}


        <div class="profile-name">

            <h3>
                {{ user.username }}
            </h3>

            <p>
                View Profile
            </p>

        </div>

        <div class="arrow">
            ›
        </div>

    </a>


    <!-- MENU -->
    <div class="menu">

        <div class="menu-title">
            Support
        </div>


        <!-- HELP CENTER -->
        <a href="{% url 'help_center' %}" class="menu-item">

            <div class="icon">
                🆘
            </div>

            <div class="menu-text">
                Help Center
            </div>

            <div class="menu-arrow">
                ›
            </div>

        </a>


        <!-- PAYMENT & REFUND -->
        <a href="{% url 'payment_refund' %}" class="menu-item">

            <div class="icon">
                💳
            </div>

            <div class="menu-text">
                Payment & Refund
            </div>

            <div class="menu-arrow">
                ›
            </div>

        </a>

    </div>


    <!-- LOGOUT -->
    <a href="{% url 'logout' %}" class="logout">
        Logout
    </a>

</div>

</body>
 <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #fff;
            color: #222;
        }

        .account-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* PROFILE */
        .profile-box {
            display: flex;
            align-items: center;
            padding: 15px 5px;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: #222;
        }

        .profile-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: 600;
            margin-right: 15px;
        }

        .profile-name {
            flex: 1;
        }

        .profile-name h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .profile-name p {
            color: #888;
            font-size: 13px;
        }

        .arrow {
            font-size: 25px;
            color: #777;
        }

        /* MENU */
        .menu {
            margin-top: 20px;
        }

        .menu-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 18px 5px;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: #333;
            cursor: pointer;
        }

        .icon {
            width: 40px;
            font-size: 22px;
        }

        .menu-text {
            flex: 1;
            font-size: 15px;
        }

        .menu-arrow {
            color: #777;
            font-size: 20px;
        }

        /* LOGOUT */
        .logout {
            margin-top: 30px;
            display: block;
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }

        .logout:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {

            .account-container {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</html>
